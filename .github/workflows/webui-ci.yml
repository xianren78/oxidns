name: WebUI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"
    tags:
      - "v*"
    paths:
      - "webui/**"
      - ".github/workflows/webui-ci.yml"
  pull_request:
    branches:
      - main
      - "release/*"
    paths:
      - "webui/**"
      - ".github/workflows/webui-ci.yml"

permissions:
  contents: read

jobs:
  webui:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck WebUI
        working-directory: webui
        run: pnpm typecheck

      - name: Lint WebUI
        working-directory: webui
        run: pnpm lint

      - name: Test WebUI
        working-directory: webui
        run: pnpm test

      - name: Build WebUI
        working-directory: webui
        run: pnpm build

      - name: Package WebUI
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf oxidns-webui.tar.gz -C webui/out .

      - name: Upload WebUI package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: oxidns-webui
          path: oxidns-webui.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish WebUI package
    if: startsWith(github.ref, 'refs/tags/')
    needs: webui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download WebUI package
        uses: actions/download-artifact@v8
        with:
          name: oxidns-webui

      - name: Upload WebUI package to release
        uses: softprops/action-gh-release@v3
        with:
          files: oxidns-webui.tar.gz
