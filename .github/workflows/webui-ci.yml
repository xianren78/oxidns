name: WebUI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"
    paths:
      - "webui/**"
      - ".github/workflows/webui-ci.yml"
  pull_request:
    branches:
      - main
      - "release/*"
    paths:
      - "webui/**"
      - ".github/workflows/webui-ci.yml"

permissions:
  contents: write

concurrency:
  group: webui-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck WebUI
        working-directory: webui
        run: pnpm typecheck

      - name: Lint WebUI
        working-directory: webui
        run: pnpm lint

      - name: Test WebUI
        working-directory: webui
        run: pnpm test

      - name: Build WebUI
        working-directory: webui
        run: pnpm build

      - name: Package WebUI
        if: github.event_name != 'pull_request'
        working-directory: webui/out
        run: zip -9 -r "${{ github.workspace }}/oxidns-webui.zip" .

      - name: Move webui tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force webui "$GITHUB_SHA"
          git push --force origin refs/tags/webui

      - name: Publish WebUI release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view webui >/dev/null 2>&1; then
            gh release upload webui oxidns-webui.zip --clobber
            gh release edit webui \
              --title "OxiDNS WebUI" \
              --notes "WebUI build from commit ${GITHUB_SHA}." \
              --latest
          else
            gh release create webui oxidns-webui.zip \
              --title "OxiDNS WebUI" \
              --notes "WebUI build from commit ${GITHUB_SHA}." \
              --latest
          fi
